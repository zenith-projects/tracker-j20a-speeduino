name: Speeduino tests

on:
  push:
    paths:
      - 'speeduino/**'
      - '.github/workflows/speeduino-tests.yml'
  pull_request:
    paths:
      - 'speeduino/**'
      - '.github/workflows/speeduino-tests.yml'
  workflow_dispatch:

jobs:
  simulator:
    name: Simulator unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speeduino
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pip install wheel

      - name: Run simavr unit tests
        run: platformio test -v -e megaatmega2560_sim_unittest

  native:
    name: Native unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speeduino
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pip install wheel

      - name: Run native unit tests
        run: platformio test -e native_base
